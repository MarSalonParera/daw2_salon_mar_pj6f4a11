# Local development only. Certificate is issued by setup-local.sh for localhost.
<VirtualHost *:443>
    ServerName localhost
    DocumentRoot /var/www/html
    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/order-management-local.crt
    SSLCertificateKeyFile /etc/apache2/ssl/order-management-local.key

    <Directory /var/www/html/restaurantOrderApp>
        Options -Indexes
        AllowOverride All
        Require all granted
        DirectoryIndex index.html
    </Directory>
    <Directory /var/www/html/restaurantOrderApp/users>
        Require all denied
    </Directory>
    <Directory /var/www/html/restaurantOrderApp/orders>
        Require all denied
    </Directory>
    <Directory /var/www/html/restaurantOrderApp/deployment>
        Require all denied
    </Directory>
    <Directory /var/www/html/restaurantOrderApp/tests>
        Require all denied
    </Directory>
    <DirectoryMatch "/\.">
        Require all denied
    </DirectoryMatch>
</VirtualHost>
