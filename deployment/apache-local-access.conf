# Enforce HTTPS only for this application, leaving other local projects alone.
<Directory /var/www/html/restaurantOrderApp>
    Options -Indexes
    AllowOverride All
    Require all granted
    DirectoryIndex index.html
    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteRule ^ https://localhost%{REQUEST_URI} [R=302,L]
</Directory>
